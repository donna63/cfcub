                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-semibold text-gray-700">Total Users</h3>
                        <p id="totalUsers" class="text-3xl font-bold text-blue-600">0</p>
                    </div>
                    <i class="fas fa-users text-3xl text-blue-500"></i>
                </div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-green-500">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-semibold text-gray-700">Total Accounts</h3>
                        <p id="totalAccounts" class="text-3xl font-bold text-green-600">0</p>
                    </div>
                    <i class="fas fa-wallet text-3xl text-green-500"></i>
                </div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-purple-500">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-semibold text-gray-700">Total Balance</h3>
                        <p id="totalBalance" class="text-3xl font-bold text-purple-600">$0.00</p>
                    </div>
                    <i class="fas fa-chart-line text-3xl text-purple-500"></i>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <!-- Create User Section -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-xl font-bold mb-4 text-gray-800 flex items-center space-x-2">
                    <i class="fas fa-user-plus text-blue-500"></i>
                    <span>Create New User & Account</span>
                </h2>
                <form id="createUserForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                            <input type="text" id="userName" required 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                            <input type="email" id="userEmail" required 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="userPassword" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Initial Balance</label>
                        <input type="number" id="initialBalance" value="0.00" step="0.01" min="0"

async function testDateFunctionality() {
    try {

        console.log('Test date:', testDate);
        console.log('Test date ISO:', testDate.toISOString());
        console.log('Test date local:', testDate.toLocaleString());
        
        // Test with a specific user
        const users = await apiCall('/api/admin/users');
        if (users.users.length > 0) {
            const testUser = users.users[0];
            console.log('Testing with user:', testUser.name);
            
            const testData = {
                userId: testUser._id,
                type: 'deposit',
                amount: 100,
                description: 'TEST - Date functionality test',
                date: testDate.toISOString()
            };
            
            console.log('Sending test data:', testData);
            
            const result = await apiCall('/api/admin/transactions', {
                method: 'POST',
                body: JSON.stringify(testData)
            });
            
            console.log('✅ Test transaction successful:', result);
            alert('✅ Date functionality test successful! Check console for details.');
        }
    } catch (error) {
        console.error('❌ Date functionality test failed:', error);
        alert('❌ Date test failed: ' + error.message);
    }
}

     async function loadUsers() {
    try {
        console.log('🔄 Loading users...');
        
        const response = await apiCall('/api/admin/users');
        const users = response.users;
        
        console.log('📋 Users loaded:', users);
        
        // ✅ FIXED: Use the correct MongoDB _id field
        const userSelect = document.getElementById('transactionUser');
        userSelect.innerHTML = '<option value="">Select a user</option>';
        
        users.forEach(user => {
            const option = document.createElement('option');
            // ✅ Use user._id (MongoDB ObjectId) instead of user.id
            option.value = user._id; 
            option.textContent = `${user.name} (${user.Account.account_number}) - $${user.Account.balance}`;
            userSelect.appendChild(option);
        });

        // Update users table - also fix the ID here
        const tbody = document.getElementById('usersTableBody');
        if (users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">No users found</td></tr>';
            return;
        }

        tbody.innerHTML = users.map(user => `
            <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 h-10 w-10 bg-blue-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-user text-blue-600"></i>
                        </div>
                        <div class="ml-4">
                            <div class="text-sm font-medium text-gray-900">${user.name}</div>
                            <div class="text-sm text-gray-500">${user.email}</div>
                        </div>
                    </div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="text-sm text-gray-900 font-mono">${user.Account.account_number}</div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="text-sm font-medium text-green-600">$${parseFloat(user.Account.balance).toFixed(2)}</div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                    ${new Date(user.createdAt).toLocaleDateString()}
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                    <!-- ✅ FIXED: Use _id instead of id -->
                    <button onclick="addSampleTransactions('${user._id}')" class="text-blue-600 hover:text-blue-900 mr-3">
                        <i class="fas fa-plus mr-1"></i>Add Sample Data
                    </button>
                </td>
            </tr>
        `).join('');

        console.log('✅ Users table updated');

    } catch (error) {
        console.error('❌ Error loading users:', error);
        document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-red-500">Error loading users</td></tr>';
    }
}

        };

        // Add detailed logging

        const response = await fetch('https://banking-backend-hqe6.onrender.com/api/users', {

        if (!response.ok) {

        }

        const data = JSON.parse(responseText);
        alert('✅ User created successfully!');

// Function to fill current date and time - FIXED VERSION
// Function to fill current date and time - UPDATED VERSION
function fillCurrentDateTime() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    
    // Use the exact format: YYYY-MM-DD HH:MM:SS
    const currentDateTime = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    document.getElementById('transactionDate').value = currentDateTime;
    console.log('📅 Filled current date/time:', currentDateTime);
    console.log('📅 This represents:', new Date().toLocaleString());
}

async function populateUserDropdown() {
    try {

        const response = await apiCall('/api/admin/users');
        const users = response.users;
        
        console.log('📋 Users for dropdown:', users);
        
        const userSelect = document.getElementById('transactionUser');
        userSelect.innerHTML = '<option value="">Select a user</option>';
        
        users.forEach(user => {
            const option = document.createElement('option');
            option.value = user._id; // Use MongoDB _id
            option.textContent = `${user.name} (${user.Account.account_number}) - $${user.Account.balance}`;
            userSelect.appendChild(option);
        });

    } catch (error) {

}
