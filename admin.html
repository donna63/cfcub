<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Banking App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fas fa-university text-2xl"></i>
                <h1 class="text-2xl font-bold">Admin Dashboard</h1>
            </div>
            <div class="flex items-center space-x-4">
                <span id="adminName" class="font-medium">Admin</span>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg transition flex items-center space-x-2">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-semibold text-gray-700">Total Users</h3>
                        <p id="totalUsers" class="text-3xl font-bold text-blue-600">0</p>
                    </div>
                    <i class="fas fa-users text-3xl text-blue-500"></i>
                </div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-green-500">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-semibold text-gray-700">Total Accounts</h3>
                        <p id="totalAccounts" class="text-3xl font-bold text-green-600">0</p>
                    </div>
                    <i class="fas fa-wallet text-3xl text-green-500"></i>
                </div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-purple-500">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-semibold text-gray-700">Total Balance</h3>
                        <p id="totalBalance" class="text-3xl font-bold text-purple-600">$0.00</p>
                    </div>
                    <i class="fas fa-chart-line text-3xl text-purple-500"></i>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <!-- Create User Section -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-xl font-bold mb-4 text-gray-800 flex items-center space-x-2">
                    <i class="fas fa-user-plus text-blue-500"></i>
                    <span>Create New User & Account</span>
                </h2>
                <form id="createUserForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                            <input type="text" id="userName" required 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                            <input type="email" id="userEmail" required 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="userPassword" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Initial Balance</label>
                        <input type="number" id="initialBalance" value="0.00" step="0.01" min="0"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white py-3 px-4 rounded-md hover:bg-green-700 transition font-semibold flex items-center justify-center space-x-2">
                        <i class="fas fa-plus-circle"></i>
                        <span>Create User & Account</span>
                    </button>
                </form>
            </div>

            <!-- Add Transaction Section -->
           <!-- Add Transaction Section -->
<div class="bg-white p-6 rounded-lg shadow">
    <h2 class="text-xl font-bold mb-4 text-gray-800 flex items-center space-x-2">
        <i class="fas fa-exchange-alt text-green-500"></i>
        <span>Add Transaction</span>
    </h2>
    <form id="addTransactionForm" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Select User</label>
            <select id="transactionUser" required 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                <option value="">Loading users...</option>
            </select>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Transaction Type</label>
                <select id="transactionType" required 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    <option value="deposit">Deposit</option>
                    <option value="withdrawal">Withdrawal</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Amount ($)</label>
                <input type="number" id="transactionAmount" required step="0.01" min="0.01"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Transaction Date</label>
            <input type="datetime-local" id="transactionDate" 
                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            <p class="text-xs text-gray-500 mt-1">Leave empty for current date/time</p>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <input type="text" id="transactionDescription" required 
                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                   placeholder="e.g., Salary deposit, ATM withdrawal">
        </div>
        
        <button type="submit" class="w-full bg-blue-600 text-white py-3 px-4 rounded-md hover:bg-blue-700 transition font-semibold flex items-center justify-center space-x-2">
            <i class="fas fa-check-circle"></i>
            <span>Add Transaction</span>
        </button>
    </form>
</div>

        <!-- Users List Section -->
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800 flex items-center space-x-2">
                    <i class="fas fa-list-alt text-purple-500"></i>
                    <span>All Users & Accounts</span>
                </h2>
                <button onclick="loadUsers()" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-md transition flex items-center space-x-2">
                    <i class="fas fa-refresh"></i>
                    <span>Refresh</span>
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Account Number</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Balance</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="5" class="px-6 py-4 text-center text-gray-500">
                                <i class="fas fa-spinner fa-spin"></i> Loading users...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/auth.js"></script>
    <script>

// ADMIN AUTH CHECK
console.log('🔐 Checking admin authentication...');
const user = checkAuth();

if (!user) {
    console.log('❌ No user, redirecting to login');
    window.location.href = 'login.html';
} else {
    console.log('✅ Admin authenticated:', user.name);
    document.getElementById('adminName').textContent = user.name;
    // Continue loading admin page...
}

        // Add this check at the top of your admin.html script
console.log('Current user:', JSON.parse(localStorage.getItem('user')));
console.log('Current token:', localStorage.getItem('token'));

        // Admin-specific functions
      async function loadUsers() {
    try {
        console.log('🔄 Loading users...');
        
        // ✅ FIXED: Added /api/ prefix
        const response = await apiCall('/api/admin/users');
        const users = response.users;
        
        console.log('📋 Users loaded:', users);
        
        // Update users dropdown
        const userSelect = document.getElementById('transactionUser');
        userSelect.innerHTML = '<option value="">Select a user</option>';
        users.forEach(user => {
            const option = document.createElement('option');
            option.value = user.id;
            option.textContent = `${user.name} (${user.Account.account_number}) - $${user.Account.balance}`;
            userSelect.appendChild(option);
        });

        // Update users table
        const tbody = document.getElementById('usersTableBody');
        if (users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">No users found</td></tr>';
            return;
        }

        tbody.innerHTML = users.map(user => `
            <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 h-10 w-10 bg-blue-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-user text-blue-600"></i>
                        </div>
                        <div class="ml-4">
                            <div class="text-sm font-medium text-gray-900">${user.name}</div>
                            <div class="text-sm text-gray-500">${user.email}</div>
                        </div>
                    </div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="text-sm text-gray-900 font-mono">${user.Account.account_number}</div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="text-sm font-medium text-green-600">$${parseFloat(user.Account.balance).toFixed(2)}</div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                    ${new Date(user.createdAt).toLocaleDateString()}
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                    <button onclick="addSampleTransactions(${user.id})" class="text-blue-600 hover:text-blue-900 mr-3">
                        <i class="fas fa-plus mr-1"></i>Add Sample Data
                    </button>
                </td>
            </tr>
        `).join('');

        console.log('✅ Users table updated');

    } catch (error) {
        console.error('❌ Error loading users:', error);
        document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-red-500">Error loading users</td></tr>';
    }
}

        // Form handlers
      // In admin.html - update the create user function
document.getElementById('createUserForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const submitBtn = this.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;
    
    try {
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
        submitBtn.disabled = true;

        const userData = {
            name: document.getElementById('userName').value,
            email: document.getElementById('userEmail').value,
            password: document.getElementById('userPassword').value,
            initialBalance: parseFloat(document.getElementById('initialBalance').value) || 0
        };

        // Add detailed logging
        console.log('Sending user data:', userData);
        
        const response = await fetch('https://banking-backend-hqe6.onrender.com/api/users', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('token') || 'test-jwt-token-for-admin'}`
            },
            body: JSON.stringify(userData)
        });

        console.log('Response status:', response.status);
        const responseText = await response.text();
        console.log('Response text:', responseText);

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${responseText}`);
        }

        const data = JSON.parse(responseText);
        alert('✅ User created successfully!');
        this.reset();
        await loadAdminData();
        
    } catch (error) {
        console.error('User creation error details:', error);
        alert('❌ Error creating user: ' + error.message);
    } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    }
});

  document.getElementById('addTransactionForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const submitBtn = this.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;
    
    try {
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        submitBtn.disabled = true;

        const transactionData = {
            userId: document.getElementById('transactionUser').value,
            type: document.getElementById('transactionType').value,
            amount: parseFloat(document.getElementById('transactionAmount').value),
            description: document.getElementById('transactionDescription').value
        };

        // ✅ FIXED: Added /api/ prefix
        const result = await apiCall('/api/admin/transactions', {
            method: 'POST',
            body: JSON.stringify(transactionData)
        });
        
        alert('✅ Transaction added successfully!\nNew balance: $' + result.new_balance);
        this.reset();
        await loadAdminData();
        
    } catch (error) {
        alert('❌ Error adding transaction: ' + error.message);
    } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    }
});

        async function addSampleTransactions(userId) {
            if (!confirm('Add sample transactions for this user?')) return;

            try {
                const transactions = [
                    { type: 'deposit', amount: 1000, description: 'Initial account funding' },
                    { type: 'deposit', amount: 2500, description: 'Salary deposit' },
                    { type: 'withdrawal', amount: 500, description: 'Rent payment' },
                    { type: 'withdrawal', amount: 150, description: 'Grocery shopping' },
                    { type: 'deposit', amount: 300, description: 'Freelance payment' }
                ];

                for (const transaction of transactions) {
                    await apiCall('api/admin/transactions', {
                        method: 'POST',
                        body: JSON.stringify({
                            userId: userId,
                            type: transaction.type,
                            amount: transaction.amount,
                            description: transaction.description
                        })
                    });
                }

                alert('✅ Sample transactions added successfully!');
                await loadAdminData();
            } catch (error) {
                alert('❌ Error adding sample transactions: ' + error.message);
            }
        }

        // Initialize admin dashboard
        document.addEventListener('DOMContentLoaded', function() {
            const user = checkAuth();
            if (user && user.role === 'admin') {
                document.getElementById('adminName').textContent = user.name;
                loadAdminData();
            } else {
                window.location.href = 'login.html';
            }
        });



       
// Temporary debug version
async function loadAdminData() {
    try {
        console.log('🔄 Loading admin data...');
        
        // Test the endpoint directly first
        const testResponse = await fetch('https://banking-backend-hqe6.onrender.com/api/admin/stats');
        console.log('Test response:', testResponse);
        
        if (!testResponse.ok) {
            throw new Error(`HTTP ${testResponse.status}`);
        }
        
        const stats = await testResponse.json();
        console.log('📊 Stats:', stats);
        
        document.getElementById('totalUsers').textContent = stats.totalUsers;
        document.getElementById('totalAccounts').textContent = stats.totalAccounts;
        document.getElementById('totalBalance').textContent = '$' + parseFloat(stats.totalBalance).toFixed(2);

        await loadUsers();
        
    } catch (error) {
        console.error('❌ Error:', error);
        alert('Error: ' + error.message);
    }
}

    </script>
</body>
